[package]
name = "tarve_native"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["mimalloc", "fxhash"]
mimalloc = ["dep:mimalloc"]
fxhash = ["dep:rustc-hash"]
# Prototype host (examples/qjs_host.rs): Tarve on an embedded QuickJS-ng, no Bun/Node/txiki.
qjs-prototype = ["dep:rquickjs"]

[dependencies]
vello = "=0.10.0"
vello_cpu = { version = "=0.2.0", default-features = false, features = ["std", "text", "u8_pipeline"] }
parley = "=0.11.1"
comrak = { version = "=0.55.0", default-features = false }
diffy = "=0.5.2"
taffy = { version = "=0.14.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size", "parse"] }
serde = { version = "1", features = ["derive"] }
# Glyph rasterization: D3D11 atlas and blurred text shadows on every platform.
swash = { version = "=0.2.10", default-features = false, features = ["std", "render"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
base64 = "0.22"
resvg = { version = "=0.48.1", default-features = false }
unicode-segmentation = "1.12"
unicode-width = "0.2"
bytemuck = "=1.25.0"
lru = { version = "0.18.5", default-features = false }
rustc-hash = { version = "2", optional = true }
rquickjs = { version = "0.10", default-features = false, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.30.12"
pollster = "0.4"
softbuffer = "=0.4.8"
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
mimalloc = { version = "0.1", default-features = false, optional = true }
syntect = { version = "=5.3.0", default-features = false, features = ["regex-onig"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-onig"] }
# <audio>/<video> sound: WASAPI on Windows, ALSA on Linux; MP3, WAV, FLAC, Ogg Vorbis and AAC in MP4, all pure Rust.
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "mp3", "wav", "flac", "vorbis", "mp4"] }
# <audio src="https://…">: range-request streaming over rustls (no system TLS library).
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Browser build (bun run build:web): no windowing, clipboard or C regex engine.
[target.'cfg(target_arch = "wasm32")'.dependencies]
syntect = { version = "=5.3.0", default-features = false, features = ["regex-fancy"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
wasm-bindgen = "=0.2.129"

[target.'cfg(windows)'.dependencies]
# `#[implement]` (the `<video>` engine callback) names this crate.
windows-core = "=0.61.2"
# DirectComposition video layers take a numerics matrix.
windows-numerics = "=0.2.0"
accesskit = "=0.25.0"
accesskit_winit = { version = "=0.34.0", default-features = false, features = ["rwh_06"] }
lyon_tessellation = "=1.0.22"
rfd = { version = "=0.17.2", default-features = false, features = ["common-controls-v6"] }
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Foundation", "Media", "Win32_Media_MediaFoundation", "Win32_Graphics_DirectComposition", "Storage_Streams", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_Ole", "Win32_Storage_EnhancedStorage"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Registry", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
accesskit = "=0.25.0"
# AT-SPI over D-Bus (pure Rust zbus); no system libraries required.
accesskit_winit = { version = "=0.34.0", default-features = false, features = ["rwh_06", "accesskit_unix", "async-io"] }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "pollster"] }
# System tray (StatusNotifierItem + dbusmenu) and notifications over the same zbus/async-io stack.
ksni = { version = "=0.3.6", default-features = false, features = ["blocking", "async-io"] }
notify-rust = { version = "=4.18.1", default-features = false, features = ["z"] }
# EWMH window state (below, skip taskbar, sticky) for desktop widgets; winit already links it.
x11rb = { version = "0.13.2", default-features = false }

# Upstream accesskit_windows 0.35.0 does not expose AccessKit Invalid through
# UIA_IsDataValidForFormPropertyId, so keep the Windows provider patch local.
[patch.crates-io]
accesskit_windows = { path = "vendor/accesskit_windows" }
# Taffy 0.14 with one fix: an auto-sized flex container counts its items' automatic
# minimum size (see vendor/taffy/src/compute/flexbox.rs, "Tarve patch").
taffy = { path = "vendor/taffy" }

[[example]]
name = "qjs_host"
required-features = ["qjs-prototype"]

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
strip = true
