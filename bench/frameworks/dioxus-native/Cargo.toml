[package]
name = "bench-dioxus-native"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["native", "macro", "html", "hooks", "signals", "launch"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
