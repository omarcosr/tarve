name: Windows x64 CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tarve-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64-native:
    name: Linux x64 native runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libfontconfig1-dev

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux native runtime
        run: bun run package:native

      - name: Upload Linux runtime
        uses: actions/upload-artifact@v4
        with:
          name: tarve-ci-linux-x64-native
          if-no-files-found: error
          retention-days: 1
          path: native/linux-x64/libtarve_native.so

  windows-x64:
    name: Windows x64 release gate
    needs: linux-x64-native
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Download Linux native runtime
        uses: actions/download-artifact@v4
        with:
          name: tarve-ci-linux-x64-native
          path: native/linux-x64

      - name: Check locked Rust dependency graph
        run: cargo check --manifest-path native/Cargo.toml --locked

      - name: Rust formatting
        run: cargo fmt --manifest-path native/Cargo.toml -- --check

      - name: Full release gate
        run: bun run release:check

      - name: Upload visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarve-visual-captures-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            dist/*-real.png
            work/*.png
          retention-days: 14
