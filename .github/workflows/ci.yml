name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tarve-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64-native:
    name: Linux x64 native runtime (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The full library and its four trimmed variants are five fat-LTO builds of ~3 min each:
    # four jobs build them side by side and the package jobs merge their outputs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: full, parts: "full" }
          - { part: rich, parts: "core,rich" }
          - { part: media, parts: "media" }
          - { part: rich-media, parts: "rich-media" }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'examples/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> target
            native -> target-variants
          prefix-key: v1-rust
          shared-key: linux-x64-native-${{ matrix.part }}

      # Cached .deb contents (no apt-get update on a hit): the mirror alone took up to 3 min.
      - name: Install Linux native dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: build-essential pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libfontconfig1-dev libasound2-dev
          version: linux-x64-native-1

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux native runtime
        run: bun scripts/package.ts --native-only --parts "${{ matrix.parts }}"

      # Only this job's parts are in native/linux-x64; the package jobs merge the three artifacts.
      - name: Upload Linux runtime
        uses: actions/upload-artifact@v7
        with:
          name: tarve-ci-linux-x64-native-${{ matrix.part }}
          if-no-files-found: error
          # The release workflow packages these for the tagged commit (release.yml, ci-runtimes).
          retention-days: 14
          path: native/linux-x64/

  # The Windows runtime (fat LTO, plus its trimmed variants) builds beside the Linux one, so the
  # package job starts once both are ready instead of building it after waiting for Linux.
  windows-x64-native:
    name: Windows x64 native runtime (${{ matrix.part }})
    runs-on: windows-latest
    timeout-minutes: 30
    # The full library and its four trimmed variants are five fat-LTO builds of ~3 min each:
    # four jobs build them side by side and the package jobs merge their outputs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: full, parts: "full" }
          - { part: rich, parts: "core,rich" }
          - { part: media, parts: "media" }
          - { part: rich-media, parts: "rich-media" }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'examples/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> target
            native -> target-variants
          prefix-key: v1-rust
          shared-key: windows-x64-native-${{ matrix.part }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows native runtime
        run: bun scripts/package.ts --native-only --parts "${{ matrix.parts }}"

      # Only this job's parts are in native/win32-x64; the package jobs merge the three artifacts.
      - name: Upload Windows runtime
        uses: actions/upload-artifact@v7
        with:
          name: tarve-ci-windows-x64-native-${{ matrix.part }}
          if-no-files-found: error
          # The release workflow packages these for the tagged commit (release.yml, ci-runtimes).
          retention-days: 14
          path: native/win32-x64/

  linux-x64:
    name: Linux x64 gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'examples/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          prefix-key: v1-rust
          shared-key: linux-x64

      - name: Install Linux native and virtual display dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libfontconfig1-dev libasound2-dev mesa-vulkan-drivers xvfb dbus python3-dbus python3-gi

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install example dependencies
        run: bun run install:examples

      - name: Check locked Rust dependency graph
        run: cargo check --manifest-path native/Cargo.toml --locked

      - name: Rust formatting
        run: cargo fmt --manifest-path native/Cargo.toml -- --check

      - name: Typecheck, lint and unit tests
        run: |
          bun run check
          bun run lint
          bun run test
          bun run test:package-clean
          bun run test:release-policy

      # Real-window smokes on a virtual X display. OS keystroke injection is
      # Windows-only, so the editor smoke uses the debug input channel here.
      - name: Real-window smoke tests
        env:
          TARVE_SMOKE_OS_INPUT: "0"
        run: |
          for step in smoke smoke:controls smoke:virtual-list smoke:rich-content smoke:motion smoke:editor smoke:steady-frames smoke:devtools smoke:text smoke:html smoke:media smoke:remote-image smoke:hidden smoke:glass test:css-layout test:canvas; do
            echo "::group::$step"
            xvfb-run -a -s "-screen 0 1920x1080x24" bun run "$step"
            echo "::endgroup::"
          done

      # A real StatusNotifierItem + dbusmenu on a private session bus, driven the way
      # a panel host drives it, with a fake notification server that clicks.
      # Tests that need the native library the smokes above built (they skip without it).
      - name: Node runtime, hot-reload and pointerFunction tests
        run: xvfb-run -a -s "-screen 0 1280x800x24" bun test packages/core/node-build.test.ts packages/core/node-dev.test.ts packages/core/src/plugins/pointer.test.ts

      - name: Tray and notification smoke
        env:
          TARVE_SMOKE_NOTIFY: "1"
        run: |
          dbus-run-session -- bash -c 'python3 scripts/fake-notification-server.py & sleep 1; xvfb-run -a -s "-screen 0 1280x800x24" bun run smoke:tray'

      - name: Upload smoke captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tarve-linux-captures-${{ github.run_id }}
          if-no-files-found: ignore
          path: work/*.png
          retention-days: 14

  windows-x64:
    name: Windows x64 release gate
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'examples/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"

      # wasm32 + wasm-bindgen: the release gate's smoke:headless-runtimes builds @tarve/headless.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          prefix-key: v1-rust
          shared-key: windows-x64

      # Must match the wasm-bindgen crate version in native/Cargo.lock.
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Check locked Rust dependency graph
        run: cargo check --manifest-path native/Cargo.toml --locked

      - name: Rust formatting
        run: cargo fmt --manifest-path native/Cargo.toml -- --check

      # txiki.js builds the --runtime txiki executables the txiki and runtime-parity
      # smokes run (a single tjs.exe; the build reads TARVE_TXIKI).
      - name: Install txiki.js
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest https://github.com/saghul/txiki.js/releases/download/v26.11.0/txiki-windows-x86_64.zip -OutFile "$env:RUNNER_TEMP\txiki.zip"
          Expand-Archive "$env:RUNNER_TEMP\txiki.zip" -DestinationPath "$env:RUNNER_TEMP\txiki"
          $tjs = "$env:RUNNER_TEMP\txiki\txiki-windows-x86_64\tjs.exe"
          & $tjs --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "TARVE_TXIKI=$tjs" >> $env:GITHUB_ENV

      # Packaging needs the Linux runtime; it runs in windows-x64-package so this
      # gate does not wait for the Linux build.
      - name: Full release gate
        env:
          TARVE_SMOKE_FORCED_WGPU: "0"
          # smoke:headless-runtimes and smoke:runtime-parity (~15 min) run beside this job in windows-x64-runtimes.
          TARVE_VERIFY_SKIP: pack,smoke:package,smoke:exe,smoke:node-cli-package,smoke:headless-runtimes,smoke:runtime-parity
          # No one works on the runner: windows may take the foreground, so the
          # accessibility smoke (keyboard focus) runs too.
          TARVE_BACKGROUND: "0"
        run: bun run release:check

      # Tests that need the native library the release gate built (they skip without it).
      - name: Node runtime, hot-reload and pointerFunction tests
        run: bun test packages/core/node-build.test.ts packages/core/node-dev.test.ts packages/core/src/plugins/pointer.test.ts

      - name: Upload visual captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tarve-visual-captures-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            dist/*-real.png
            work/*.png
          retention-days: 14

  # The release gate's two longest steps, each in a job of its own beside it: the same app under
  # every runtime (Bun, Node SEA, txiki.js) and the headless runtimes (native + WebAssembly).
  windows-x64-runtimes:
    name: Windows x64 ${{ matrix.smoke == 'smoke:runtime-parity' && 'runtime parity' || 'headless runtimes' }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        smoke: ["smoke:runtime-parity", "smoke:headless-runtimes"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'examples/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      # The release gate saves this cache; it builds the same debug and release libraries.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          prefix-key: v1-rust
          shared-key: windows-x64
          save-if: false

      # Must match the wasm-bindgen crate version in native/Cargo.lock.
      - name: Install wasm-bindgen
        if: matrix.smoke == 'smoke:headless-runtimes'
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install example dependencies
        run: bun run install:examples

      - name: Install txiki.js
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest https://github.com/saghul/txiki.js/releases/download/v26.11.0/txiki-windows-x86_64.zip -OutFile "$env:RUNNER_TEMP\txiki.zip"
          Expand-Archive "$env:RUNNER_TEMP\txiki.zip" -DestinationPath "$env:RUNNER_TEMP\txiki"
          $tjs = "$env:RUNNER_TEMP\txiki\txiki-windows-x86_64\tjs.exe"
          & $tjs --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "TARVE_TXIKI=$tjs" >> $env:GITHUB_ENV

      # The environment scripts/verify.ts gives its steps.
      - name: Smoke
        env:
          TARVE_BACKGROUND: "0"
          TARVE_GPU_DAMAGE_CHECK: "1"
          TARVE_REDUCED_MOTION: "0"
          TARVE_SMOKE_FORCED_WGPU: "0"
        run: bun run ${{ matrix.smoke }}

      - name: Upload runtime parity captures
        if: failure() && matrix.smoke == 'smoke:runtime-parity'
        uses: actions/upload-artifact@v7
        with:
          name: tarve-runtime-parity-${{ github.run_id }}
          if-no-files-found: ignore
          path: work/runtime-parity/*.png
          retention-days: 14

  # Packaging takes seconds once both runtimes exist (--prebuilt), so each group of package
  # smokes packages on its own and they run side by side.
  windows-x64-package:
    name: Package (${{ matrix.group }})
    needs: [linux-x64-native, windows-x64-native]
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [install, executable, node-cli]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'examples/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> target
            native -> target-variants
          prefix-key: v1-rust
          shared-key: windows-x64-package

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # smoke:package copies the example app and its installed icon packages.
      - name: Install example dependencies
        run: bun run install:examples

      - name: Download Linux native runtime
        uses: actions/download-artifact@v8
        with:
          pattern: tarve-ci-linux-x64-native-*
          merge-multiple: true
          path: native/linux-x64

      - name: Download Windows native runtime
        uses: actions/download-artifact@v8
        with:
          pattern: tarve-ci-windows-x64-native-*
          merge-multiple: true
          path: native/win32-x64

      # One step per command: a multi-line pwsh script only reports the exit code
      # of its last command, which let earlier failures pass silently.
      # TARVE_NATIVE_PREBUILT: package the runtime windows-x64-native built (checked against
      # this checkout) instead of building it again.
      - name: Package
        env:
          TARVE_NATIVE_PREBUILT: "1"
        run: bun run package

      # `bun run package` just built the staging: skip prepack's second package build.
      - name: Pack
        env:
          TARVE_SKIP_PREPACK: "1"
        run: bun run pack

      - name: Package install smoke
        if: matrix.group == 'install'
        run: bun run smoke:package

      - name: Node-only package and executable smoke
        if: matrix.group == 'install'
        run: bun scripts/smoke-node-package.ts

      - name: Standalone executable smoke
        if: matrix.group == 'executable'
        run: bun run smoke:exe

      - name: Node-only tarve package smoke (deb, tar, zip, app-zip, setup)
        if: matrix.group == 'node-cli'
        run: bun run smoke:node-cli-package

  # @tarve/headless renders with the WebAssembly build: no window, GPU or native library. Running
  # it on every OS (macOS on ARM included) checks that the stored image snapshots are byte-identical
  # everywhere, which is the package's promise.
  headless:
    name: Headless (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'examples/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          prefix-key: v1-rust
          shared-key: wasm-${{ matrix.os }}

      # Must match the wasm-bindgen crate version in native/Cargo.lock.
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build the WebAssembly runtime
        run: bun run build:wasm

      - name: Headless tests and image snapshots
        run: bun run test:headless

      - name: Verify the packed package
        if: matrix.os == 'ubuntu-latest'
        run: bun packages/headless/scripts/verify-pack.ts

      - name: Upload snapshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tarve-headless-snapshots-${{ matrix.os }}-${{ github.run_id }}
          if-no-files-found: ignore
          path: packages/headless/__snapshots__/*.actual.png
          retention-days: 14

  # Known vulnerabilities in the locked dependency graphs. Unmaintained/yanked
  # advisories only warn; cargo audit fails on a vulnerability.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'examples/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit --file native/Cargo.lock

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Audit JS dependencies
        run: bun audit
