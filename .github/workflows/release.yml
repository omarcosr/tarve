name: Tarve Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tarve-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x64-native:
    name: Linux x64 native runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: linux-x64-native
          save-if: false

      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libfontconfig1-dev

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux package runtime
        run: bun run package:native

      - name: Upload Linux runtime
        uses: actions/upload-artifact@v4
        with:
          name: tarve-linux-x64-native
          if-no-files-found: error
          retention-days: 1
          path: |
            native/linux-x64/libtarve_native.so
            native/linux-x64/runtime.json

  windows-x64-release:
    name: Windows x64 release
    needs: linux-x64-native
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # Reuse the Windows cache that CI builds on main (tag runs can read it).
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: windows-x64
          save-if: false

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Download Linux runtime
        uses: actions/download-artifact@v4
        with:
          name: tarve-linux-x64-native
          path: native/linux-x64

      - name: Validate release ref and version policy
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ("${{ github.ref_type }}" -ne "tag") {
            throw "Releases must run from a tag."
          }
          bun scripts/release-policy.ts --tag "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Release policy failed for $env:GITHUB_REF_NAME." }
          git fetch origin "$env:DEFAULT_BRANCH" --no-tags
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch $env:DEFAULT_BRANCH." }
          git merge-base --is-ancestor "$env:GITHUB_SHA" "origin/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag must point to a commit reachable from the default branch."
          }

      # The tagged commit already went through the full gate in CI (typecheck,
      # clippy, tests, real-window smokes, package and executable smokes on both
      # platforms). Require that green run instead of repeating ~20 minutes of it.
      - name: Require green CI for the tagged commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deadline = (Get-Date).AddMinutes(40)
          while ($true) {
            $runs = gh run list --workflow ci.yml --commit "$env:GITHUB_SHA" --json status,conclusion | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Could not query CI runs." }
            if ($runs | Where-Object { $_.status -eq "completed" -and $_.conclusion -eq "success" }) { break }
            if (-not ($runs | Where-Object { $_.status -ne "completed" })) {
              throw "No successful CI run for $env:GITHUB_SHA. Push the commit to main and let CI pass before tagging."
            }
            if ((Get-Date) -gt $deadline) { throw "Timed out waiting for CI on $env:GITHUB_SHA." }
            Write-Host "Waiting for CI on $env:GITHUB_SHA..."
            Start-Sleep -Seconds 30
          }

      # Tarve is a framework: application authors sign the executables they build.
      - name: Build and verify release artifacts
        env:
          TARVE_RELEASE_TAG: ${{ github.ref_name }}
        run: bun run release:build

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tarve-${{ github.ref_name }}-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/tarve-core-*.tgz
            dist/tarve-react-icons-*.tgz
            dist/release-manifest.json
            native/win32-x64/tarve_native.dll
            native/win32-x64/runtime.json
            native/linux-x64/libtarve_native.so
            native/linux-x64/runtime.json

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tarball = (Get-ChildItem -LiteralPath dist -Filter "tarve-core-*.tgz" -File | Select-Object -First 1).FullName
          if (-not $tarball) { throw "Release tarball is missing." }
          $arguments = @(
            "release", "create", "$env:GITHUB_REF_NAME",
            $tarball,
            (Get-ChildItem -LiteralPath dist -Filter "tarve-react-icons-*.tgz" -File | Select-Object -First 1).FullName,
            "dist/release-manifest.json",
            "native/win32-x64/tarve_native.dll",
            "native/linux-x64/libtarve_native.so",
            "--verify-tag",
            "--generate-notes",
            "--title", "Tarve $env:GITHUB_REF_NAME"
          )
          if ($env:GITHUB_REF_NAME -match "-") { $arguments += "--prerelease" }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed." }

  npm-publish:
    name: Publish npm packages
    needs: windows-x64-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Node for npm
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download verified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: tarve-${{ github.ref_name }}-windows-x64
          path: release

      - name: Publish verified tarballs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is not configured for the npm environment." >&2
            exit 1
          fi
          version="${TAG#v}"
          dist_tag=latest
          case "${version}" in *-*) dist_tag=next ;; esac
          # @tarve/core first: @tarve/react-icons declares it as a peer.
          for pair in "@tarve/core:tarve-core" "@tarve/react-icons:tarve-react-icons"; do
            name="${pair%%:*}"
            tarball="release/dist/${pair#*:}-${version}.tgz"
            if [ ! -f "${tarball}" ]; then
              echo "::error::Expected ${tarball}; found: $(find release -name '*.tgz')" >&2
              exit 1
            fi
            packed="$(tar -xOzf "${tarball}" package/package.json | node -p 'const p=JSON.parse(require("fs").readFileSync(0)); p.name+"@"+p.version')"
            if [ "${packed}" != "${name}@${version}" ]; then
              echo "::error::${tarball} contains ${packed}, expected ${name}@${version}." >&2
              exit 1
            fi
            # Re-runs after a partial publish skip versions that already exist.
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published; skipping."
              continue
            fi
            npm publish "${tarball}" --access public --provenance --tag "${dist_tag}"
          done
