name: Tarve Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tarve-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The desktop runtimes are the ones CI built and tested for the tagged commit (its native jobs
  # upload them for 14 days): the release waits for that green CI run instead of building them
  # again. The release job still checks them against the tagged sources before packaging.
  ci-runtimes:
    name: CI runtimes of the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      run-id: ${{ steps.ci.outputs.run-id }}

    steps:
      - name: Wait for green CI and find its run
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          deadline=$(( $(date +%s) + 40 * 60 ))
          while true; do
            id=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 20 --json databaseId,status,conclusion \
              --jq '[.[] | select(.status == "completed" and .conclusion == "success")][0].databaseId // empty')
            if [ -n "$id" ]; then break; fi
            pending=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
            if [ "$pending" = "0" ]; then
              echo "::error::No successful CI run for $GITHUB_SHA. Push the commit to main and let CI pass before tagging."
              exit 1
            fi
            if [ "$(date +%s)" -gt "$deadline" ]; then echo "::error::Timed out waiting for CI on $GITHUB_SHA."; exit 1; fi
            echo "Waiting for CI on $GITHUB_SHA..."
            sleep 30
          done
          # Each runtime comes in one artifact per part of ci.yml's native matrix (keep in sync).
          live=$(gh api "repos/$GH_REPO/actions/runs/$id/artifacts?per_page=100" --jq '.artifacts[] | select(.expired | not) | .name')
          for name in tarve-ci-linux-x64-native tarve-ci-windows-x64-native; do
            for part in full rich media rich-media; do
              if ! grep -qx "$name-$part" <<< "$live"; then
                echo "::error::CI run $id has no live $name-$part artifact (expired after 14 days?). Re-run CI for $GITHUB_SHA, then re-run this release."
                exit 1
              fi
            done
          done
          echo "CI run $id"
          echo "run-id=$id" >> "$GITHUB_OUTPUT"

  # `tarve build --target android` looks for native/android/<abi>/libtarve_native.so in the
  # package (package.json "files" lists native/android); build both ABIs from the tag.
  android-native:
    name: Android native runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target-android
          shared-key: android-native

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # The runner image ships the Android NDK (ANDROID_NDK_LATEST_HOME).
      - name: Build Android runtimes
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" bun run build:native:android

      - name: Upload Android runtimes
        uses: actions/upload-artifact@v7
        with:
          name: tarve-android-native
          if-no-files-found: error
          retention-days: 1
          path: |
            native/android/arm64-v8a/libtarve_native.so
            native/android/x86_64/libtarve_native.so

  windows-x64-release:
    name: Windows x64 release
    needs: [ci-runtimes, android-native]
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # The WebAssembly runtime and the example builds compile against CI's package job cache.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> target
            native -> target-variants
          prefix-key: v1-rust
          shared-key: windows-x64-package
          save-if: false

      # @tarve/headless ships the WebAssembly runtime built from the tagged sources.
      - name: Add the WebAssembly target and wasm-bindgen
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Download Linux runtime
        uses: actions/download-artifact@v8
        with:
          pattern: tarve-ci-linux-x64-native-*
          merge-multiple: true
          path: native/linux-x64
          run-id: ${{ needs.ci-runtimes.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Download Android runtimes
        uses: actions/download-artifact@v8
        with:
          name: tarve-android-native
          path: native/android

      - name: Download Windows runtime
        uses: actions/download-artifact@v8
        with:
          pattern: tarve-ci-windows-x64-native-*
          merge-multiple: true
          path: native/win32-x64
          run-id: ${{ needs.ci-runtimes.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Validate release ref and version policy
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ("${{ github.ref_type }}" -ne "tag") {
            throw "Releases must run from a tag."
          }
          bun scripts/release-policy.ts --tag "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Release policy failed for $env:GITHUB_REF_NAME." }
          git fetch origin "$env:DEFAULT_BRANCH" --no-tags
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch $env:DEFAULT_BRANCH." }
          git merge-base --is-ancestor "$env:GITHUB_SHA" "origin/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag must point to a commit reachable from the default branch."
          }

      # Tarve is a framework: application authors sign the executables they build.
      # TARVE_NATIVE_PREBUILT: package the Windows runtime CI built for this commit (checked
      # against the tagged sources) instead of building it again here.
      - name: Build and verify release artifacts
        env:
          TARVE_RELEASE_TAG: ${{ github.ref_name }}
          TARVE_NATIVE_PREBUILT: "1"
        run: bun run release:build

      # The YouTube Music demo executables ship from their own repository (omarcosr/youtube-music).
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tarve-${{ github.ref_name }}-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/tarve-core-*.tgz
            dist/tarve-react-icons-*.tgz
            dist/tarve-headless-*.tgz
            dist/tarve-svelte-*.tgz
            dist/tarve-router-*.tgz
            dist/tarve-test-*.tgz
            dist/tarve-mcp-*.tgz
            dist/create-tarve-*.tgz
            dist/release-manifest.json
            native/win32-x64/tarve_native.dll
            native/win32-x64/runtime.json
            native/linux-x64/libtarve_native.so
            native/linux-x64/runtime.json
            native/android/arm64-v8a/libtarve_native.so
            native/android/x86_64/libtarve_native.so

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release assets are flat: give the Android libraries names of their own.
          Copy-Item native/android/arm64-v8a/libtarve_native.so dist/libtarve_native-android-arm64-v8a.so
          Copy-Item native/android/x86_64/libtarve_native.so dist/libtarve_native-android-x86_64.so
          $tarball = (Get-ChildItem -LiteralPath dist -Filter "tarve-core-*.tgz" -File | Select-Object -First 1).FullName
          if (-not $tarball) { throw "Release tarball is missing." }
          $arguments = @(
            "release", "create", "$env:GITHUB_REF_NAME",
            $tarball,
            (Get-ChildItem -LiteralPath dist -Filter "tarve-react-icons-*.tgz" -File | Select-Object -First 1).FullName,
            (Get-ChildItem -LiteralPath dist -Filter "tarve-headless-*.tgz" -File | Select-Object -First 1).FullName,
            (Get-ChildItem -LiteralPath dist -Filter "tarve-svelte-*.tgz" -File | Select-Object -First 1).FullName,
            (Get-ChildItem -LiteralPath dist -Filter "tarve-router-*.tgz" -File | Select-Object -First 1).FullName,
            (Get-ChildItem -LiteralPath dist -Filter "tarve-test-*.tgz" -File | Select-Object -First 1).FullName,
            (Get-ChildItem -LiteralPath dist -Filter "tarve-mcp-*.tgz" -File | Select-Object -First 1).FullName,
            (Get-ChildItem -LiteralPath dist -Filter "create-tarve-*.tgz" -File | Select-Object -First 1).FullName,
            "dist/release-manifest.json",
            "native/win32-x64/tarve_native.dll",
            "native/linux-x64/libtarve_native.so",
            "dist/libtarve_native-android-arm64-v8a.so",
            "dist/libtarve_native-android-x86_64.so",
            "--verify-tag",
            "--generate-notes",
            "--title", "Tarve $env:GITHUB_REF_NAME"
          )
          if ($env:GITHUB_REF_NAME -match "-") { $arguments += "--prerelease" }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed." }

  npm-publish:
    name: Publish npm packages
    needs: windows-x64-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Node for npm
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          name: tarve-${{ github.ref_name }}-windows-x64
          path: release

      - name: Publish verified tarballs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is not configured for the npm environment." >&2
            exit 1
          fi
          version="${TAG#v}"
          dist_tag=latest
          case "${version}" in *-*) dist_tag=next ;; esac
          # @tarve/core first, then @tarve/headless: the other packages declare them as peers.
          for pair in "@tarve/core:tarve-core" "@tarve/headless:tarve-headless" "@tarve/react-icons:tarve-react-icons" "@tarve/svelte:tarve-svelte" "@tarve/router:tarve-router" "@tarve/test:tarve-test" "@tarve/mcp:tarve-mcp" "create-tarve:create-tarve"; do
            name="${pair%%:*}"
            tarball="release/dist/${pair#*:}-${version}.tgz"
            if [ ! -f "${tarball}" ]; then
              echo "::error::Expected ${tarball}; found: $(find release -name '*.tgz')" >&2
              exit 1
            fi
            packed="$(tar -xOzf "${tarball}" package/package.json | node -p 'const p=JSON.parse(require("fs").readFileSync(0)); p.name+"@"+p.version')"
            if [ "${packed}" != "${name}@${version}" ]; then
              echo "::error::${tarball} contains ${packed}, expected ${name}@${version}." >&2
              exit 1
            fi
            # Re-runs after a partial publish skip versions that already exist.
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published; skipping."
              continue
            fi
            npm publish "${tarball}" --access public --provenance --tag "${dist_tag}"
          done

  # The site documents the version just published: deploy it from the tagged sources.
  # Needs the CLOUDFLARE_API_TOKEN secret (Workers edit) on the "site" environment;
  # without it the job warns and stops, the release itself is not affected.
  site-deploy:
    name: Deploy tarve.dev
    needs: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: site
    permissions:
      contents: read

    steps:
      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not configured for the site environment: deploy tarve.dev by hand (cd website && bun run deploy)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.credentials.outputs.deploy == 'true'
        uses: actions/checkout@v7

      - name: Setup Bun
        if: steps.credentials.outputs.deploy == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Rust
        if: steps.credentials.outputs.deploy == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      # The site's playgrounds run the WebAssembly runtime.
      - name: Install wasm-bindgen
        if: steps.credentials.outputs.deploy == 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Install dependencies
        if: steps.credentials.outputs.deploy == 'true'
        run: |
          bun install --frozen-lockfile
          cd website && bun install --frozen-lockfile

      - name: Build and deploy
        if: steps.credentials.outputs.deploy == 'true'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bun run build:cf
          bunx wrangler deploy
